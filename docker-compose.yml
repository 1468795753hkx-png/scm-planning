version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: scm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://scm:change-me@db:5432/scm
      SECRET_KEY: change-me
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: